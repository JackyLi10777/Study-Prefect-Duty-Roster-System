name: Quality gates

on:
  push:
    branches: [main, nicegui-self-hosted]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # Tags resolved from the first-party repositories on 2026-07-22.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Enable the lockfile-owned pnpm version
        run: corepack enable
      - name: Classify update risk
        id: update-plan
        env:
          VERIFY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          VERIFY_HEAD: ${{ github.sha }}
        run: |
          if (-not $env:VERIFY_BASE -or $env:VERIFY_BASE -match '^0+$') {
            $env:VERIFY_BASE = 'HEAD^'
          }
          python -X utf8 scripts/verify_update.py `
            --base $env:VERIFY_BASE `
            --head $env:VERIFY_HEAD `
            --plan `
            --ci `
            --github-output $env:GITHUB_OUTPUT
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: steps.update-plan.outputs.needs_deno == 'true'
        with:
          deno-version: 2.9.2
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Run risk-based verification
        env:
          VERIFY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          VERIFY_HEAD: ${{ github.sha }}
        run: |
          if (-not $env:VERIFY_BASE -or $env:VERIFY_BASE -match '^0+$') {
            $env:VERIFY_BASE = 'HEAD^'
          }
          python -X utf8 scripts/verify_update.py `
            --base $env:VERIFY_BASE `
            --head $env:VERIFY_HEAD `
            --ci
