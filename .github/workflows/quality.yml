name: Quality gates

on:
  push:
    branches: [main, nicegui-self-hosted]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Classify update risk
        id: update-plan
        env:
          VERIFY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          VERIFY_HEAD: ${{ github.sha }}
        run: |
          if (-not $env:VERIFY_BASE -or $env:VERIFY_BASE -match '^0+$') {
            $env:VERIFY_BASE = 'HEAD^'
          }
          python -X utf8 scripts/verify_update.py `
            --base $env:VERIFY_BASE `
            --head $env:VERIFY_HEAD `
            --plan `
            --ci `
            --github-output $env:GITHUB_OUTPUT
      - uses: denoland/setup-deno@v2
        if: steps.update-plan.outputs.needs_deno == 'true'
        with:
          deno-version: v2.x
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Run risk-based verification
        env:
          VERIFY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          VERIFY_HEAD: ${{ github.sha }}
        run: |
          if (-not $env:VERIFY_BASE -or $env:VERIFY_BASE -match '^0+$') {
            $env:VERIFY_BASE = 'HEAD^'
          }
          python -X utf8 scripts/verify_update.py `
            --base $env:VERIFY_BASE `
            --head $env:VERIFY_HEAD `
            --ci
