name: Quality gates

on:
  push:
    branches: [main, nicegui-self-hosted]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Run automated tests
        run: python -X utf8 -m pytest -q
      - name: Verify Cloudflare Worker boundary
        working-directory: cloudflare/roster_viewer
        run: |
          deno check worker.js
          deno test worker_gateway_test.js
      - name: Verify repository boundaries
        run: python -X utf8 scripts/check_repository_hygiene.py
      - name: Run security gates
        run: python -X utf8 scripts/run_security_checks.py
