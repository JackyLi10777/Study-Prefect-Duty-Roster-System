# .streamlit/config.toml
# Sing Yin Secondary School Study Prefect Duty Roster Platform
# 聖言中學導學風紀當值排班平台 - Streamlit Cloud 專用設定檔
# 作者：Head Study Prefect 26-27 LI Chuangjie Jacky
# 版本：v2.4 Final

[theme]
primaryColor = "#0B1E3D"           # 深藍專業色（聖言風格）
backgroundColor = "#F8F9FA"
secondaryBackgroundColor = "#F1F3F5"
textColor = "#1A1A2E"
base = "light"

[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 50                 # 提升上傳限制（方便匯入 Excel）

[client]
showSidebarNavigation = true
showErrorDetails = false

[logger]
level = "WARNING"
messageFormat = "%(asctime)s - %(levelname)s - %(message)s"

[runner]
fastReruns = true
magicEnabled = false

[browser]
gatherUsageStats = false
serverAddress = "0.0.0.0"


# 推薦開啟寬版面（視覺公告版更舒服）
# 如需暗色主題可取消下面註解
# [theme]
# base = "dark"
